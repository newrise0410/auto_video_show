# 분야가 어긋난 낱말 → 낭독에 맞는 대안.
#
# **탐지용이지 치환용이 아니다.** 「저주가 성립했다」는 고쳐야 하지만
# 「계약이 성립했다」는 옳다. 같은 낱말이 문맥에 따라 맞기도 틀리기도 하므로
# 자동 치환하지 않고 어디에 있는지만 알려준다. `_warn_on_overlong` 이 대본을
# 자르지 않고 경고만 하는 것과 같은 이유다.
#
# 기준은 한자어냐 고유어냐가 아니다. **소리 내어 들었을 때 한 번에
# 알아들리는가** 하나뿐이다. 번역투 단속을 순혈주의로 밀면 그 자체로
# 이상해진다 (https://www.ppss.kr/news/articleView.html?idxno=79671).
#
# 여섯 개는 2026-08-20 오디세우스 롱폼 실측에서 나왔다. 나머지는 국립국어원
# 다듬은 말 / 쉬운 우리말 사전에서 채굴한다.
#   https://www.korean.go.kr/front/imprv/refineList.do?mn_id=158
#   https://www.plainkorean.kr/ko/dictionary/dic_new.do

words:
  # --- 실측 (오디세우스 롱폼 36씬) — 괄호는 그 말이 원래 사는 분야
  성립했: 걸렸 / 시작됐 (계약·법률)
  청구되: 치르 / 날아오 (회계)
  무력화: 흐지부지 만들 (군사·법률)
  선택지: 길 / 방법 (게임·설문)
  기항지: 배를 댄 곳 (해운)
  전술: 방법 / 수 (군사)

  # --- 같은 부류로 흔히 딸려 오는 말
  불가능해졌: 길이 없어졌
  획득했: 얻었
  상실했: 잃었
  개시했: 시작했
  종료됐: 끝났
  소지하고: 지니고
  경유하여: 거쳐
  요구된: 필요한
  실시했: 했
  발생했: 일어났
  존재했: 있었
